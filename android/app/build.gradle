plugins {
    id 'com.android.application'
}

android {
    namespace "app.tallypitch.twa"
    compileSdk 34

    defaultConfig {
        applicationId "app.tallypitch.twa"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def assetStatements = '[{ "relation": ["delegate_permission/common.handle_all_urls"], "target": { "namespace": "web", "site": "https://tallypitch.app" } }]'

        manifestPlaceholders = [
            hostName: "tallypitch.app",
            defaultUrl: "https://tallypitch.app",
            launcherName: "TallyPitch",
            assetStatements: assetStatements.replace('"', '\\"')
        ]
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.browser:browser:1.8.0'
}
