name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-and-test:
    name: Verify & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node Dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          fi

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pytest
          python -m playwright install --with-deps chromium

      - name: Run Pipeline Doctor
        run: |
          chmod +x ./pipeline.sh
          ./pipeline.sh doctor

      - name: Verify Distribution Parity
        run: |
          diff -u index.html dist/index.html || {
            echo "Distribution parity mismatch: dist/index.html does not match index.html."
            exit 1
          }

      - name: Run E2E & Regression Tests
        run: |
          ./pipeline.sh test --summary
